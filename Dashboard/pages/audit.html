<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFMMS - Audit Trail</title>
    <link rel="icon" href="/images/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#1B365D', dark: '#0F2038', light: '#2A4D7E' }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .modal {
            display: none;
        }
        .modal.show, .modal[style*="display: flex"] {
            display: flex !important;
        }
        .view-btn {
            background: #F8FAFC;
            color: #1B365D;
            border: 1px solid #CBD5E1;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .view-btn:hover {
            background: #1B365D;
            color: #FFFFFF;
            border-color: #1B365D;
        }
        .action-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            background: #EFF6FF;
            color: #1D4ED8;
            border: 1px solid #BFDBFE;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

<div class="flex min-h-screen app-wrapper">

    <aside class="sidebar"></aside>

    <main class="flex-1 min-w-0 p-6 lg:p-8 page-content">

        <!-- HEADER -->
        <div class="flex justify-between items-start mb-6">
            <div>
                <h1 class="text-2xl lg:text-3xl font-bold text-navy">Audit Trail</h1>
                <p class="text-sm text-slate-500 mt-1">Monitor and review financial system activities</p>
            </div>

            <button class="bg-navy hover:bg-navy-dark text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-all shadow-sm flex items-center gap-1.5"
                    type="button"
                    onclick="loadAuditLogs()"
                    id="refreshBtn">
                Refresh
            </button>
        </div>

        <!-- SUMMARY CARDS -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Total Activities</div>
                <div class="text-2xl lg:text-3xl font-bold text-slate-900 mt-2" id="totalLogs">0</div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Unique Users</div>
                <div class="text-2xl lg:text-3xl font-bold text-blue-600 mt-2" id="userCount">0</div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Today's Activities</div>
                <div class="text-2xl lg:text-3xl font-bold text-emerald-600 mt-2" id="todayCount">0</div>
            </div>
        </section>

        <!-- FILTERS -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 lg:p-5 mb-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end">
                <div class="sm:col-span-2 lg:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1" for="searchAudit">Search</label>
                    <input type="search"
                           id="searchAudit"
                           placeholder="Search user, action, table, or details..."
                           class="w-full h-10 px-3.5 border border-slate-200 rounded-lg text-sm bg-slate-50 font-sans outline-none focus:bg-white focus:border-navy focus:ring-2 focus:ring-navy/10">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1" for="filterUser">User</label>
                    <select id="filterUser"
                            class="w-full h-10 px-3 border border-slate-200 rounded-lg text-sm bg-slate-50 font-sans outline-none focus:bg-white focus:border-navy">
                        <option value="">All Users</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1" for="filterAction">Action</label>
                    <select id="filterAction"
                            class="w-full h-10 px-3 border border-slate-200 rounded-lg text-sm bg-slate-50 font-sans outline-none focus:bg-white focus:border-navy">
                        <option value="">All Actions</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1" for="filterDate">Date</label>
                        <input type="date"
                               id="filterDate"
                               class="w-full h-10 px-2.5 border border-slate-200 rounded-lg text-sm bg-slate-50 font-sans outline-none focus:bg-white focus:border-navy">
                    </div>
                    <button class="h-10 px-4 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg text-sm font-semibold transition-all mt-auto"
                            type="button"
                            onclick="resetFilters()">
                        Reset
                    </button>
                </div>
            </div>
        </section>

        <!-- AUDIT TABLE -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-base font-bold text-navy">Activity Records</h2>
                <span class="text-xs px-2.5 py-1 rounded bg-slate-100 text-slate-600 font-medium" id="recordCount">0 records</span>
            </div>

            <div class="overflow-x-auto w-full">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                        <tr class="[&>th]:py-3.5 [&>th]:px-4 [&>th]:font-semibold [&>th]:uppercase [&>th]:tracking-wider">
                            <th>Date & Time</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Table</th>
                            <th>Details</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="auditTableBody" class="divide-y divide-slate-100 [&>tr>td]:py-3.5 [&>tr>td]:px-4">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-slate-400">Loading audit logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination Controls -->
            <div id="auditPagination" class="flex justify-between items-center px-4 py-3 border-t border-slate-100 bg-slate-50/50 rounded-b-xl gap-2"></div>
        </section>

    </main>

</div>

<!-- DETAILS MODAL -->
<div class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm justify-center items-center z-[2500] p-4 overflow-y-auto"
     id="detailsModal"
     onclick="handleModalBackdrop(event)">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden m-auto relative flex flex-col max-h-[90vh] z-10"
         onclick="event.stopPropagation()">
        <div class="flex-shrink-0 flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-white">
            <h3 class="text-base font-bold text-navy">Audit Activity Details</h3>
            <button class="text-slate-400 hover:text-slate-600 text-2xl font-light leading-none"
                    type="button"
                    onclick="closeDetailsModal()">
                &times;
            </button>
        </div>

        <div class="p-6 overflow-y-auto flex-1 min-h-0">
            <div class="grid grid-cols-2 gap-4">
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">User</span>
                    <strong class="text-sm font-semibold text-slate-800 mt-1 block" id="detailUser">—</strong>
                </div>

                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Action</span>
                    <strong class="text-sm font-semibold text-navy mt-1 block" id="detailAction">—</strong>
                </div>

                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Table</span>
                    <strong class="text-sm font-semibold text-slate-800 mt-1 block" id="detailTable">—</strong>
                </div>

                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Date & Time</span>
                    <strong class="text-sm font-semibold text-slate-800 mt-1 block" id="detailDate">—</strong>
                </div>

                <div class="col-span-2 p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Details</span>
                    <strong class="text-sm font-medium text-slate-700 mt-1 block break-words" id="detailDetails">—</strong>
                </div>
            </div>
        </div>

        <div class="flex-shrink-0 flex justify-end px-6 py-4 border-t border-slate-100 bg-slate-50">
            <button type="button"
                    class="px-4 py-2 border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 rounded-lg text-sm font-semibold transition-all"
                    onclick="closeDetailsModal()">
                Close
            </button>
        </div>
    </div>
</div>

<script>
    // ========================================================
    // AUTHENTICATION
    // ========================================================

    const token =
        sessionStorage.getItem("token");


    if (!token) {

        window.location.replace(
            "login.html"
        );

    }


    // ========================================================
    // DATA
    // ========================================================

    let allAuditLogs = [];
    let currentPage = 1;
    const PAGE_SIZE = 10;


    async function fetchAuditLogs() {

        const response = await fetch(
            "/api/audit",
            {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const responseText = await response.text();
        let data;

        try {
            data = responseText ? JSON.parse(responseText) : null;
        } catch {
            data = responseText;
        }

        if (!response.ok) {
            throw new Error(data?.error || "Unable to load audit logs.");
        }

        return data;
    }


    // ========================================================
    // HELPERS
    // ========================================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDateTime(value) {

        if (!value) {

            return "—";

        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(value);

        }


        return date.toLocaleString(
            "en-PH",
            {
                year: "numeric",
                month: "short",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    function getDateOnly(value) {

        if (!value) {

            return "";

        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(value)
                .split("T")[0];

        }


        return [
            date.getFullYear(),
            String(
                date.getMonth() + 1
            ).padStart(2, "0"),
            String(
                date.getDate()
            ).padStart(2, "0")
        ].join("-");

    }


    // ========================================================
    // SUMMARY
    // ========================================================

    function calculateSummary(logs) {

        const today =
            new Date();


        const todayString =
            getDateOnly(today);


        const users =
            new Set(
                logs
                    .map(log =>
                        log.user_name
                    )
                    .filter(Boolean)
            );


        const todayCount =
            logs.filter(log =>
                getDateOnly(
                    log.created_at
                ) === todayString
            ).length;


        document.getElementById(
            "totalLogs"
        ).textContent =
            logs.length.toLocaleString();


        document.getElementById(
            "userCount"
        ).textContent =
            users.size.toLocaleString();


        document.getElementById(
            "todayCount"
        ).textContent =
            todayCount.toLocaleString();

    }


    // ========================================================
    // FILTER OPTIONS
    // ========================================================

    function populateFilters(logs) {

        const userSelect =
            document.getElementById(
                "filterUser"
            );


        const actionSelect =
            document.getElementById(
                "filterAction"
            );


        const users =
            [...new Set(
                logs
                    .map(log =>
                        log.user_name
                    )
                    .filter(Boolean)
            )]
            .sort();


        const actions =
            [...new Set(
                logs
                    .map(log =>
                        log.action_type
                    )
                    .filter(Boolean)
            )]
            .sort();


        userSelect.innerHTML = `
            <option value="">
                All Users
            </option>
        `;


        users.forEach(user => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                user;

            option.textContent =
                user;

            userSelect.appendChild(
                option
            );

        });


        actionSelect.innerHTML = `
            <option value="">
                All Actions
            </option>
        `;


        actions.forEach(action => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                action;

            option.textContent =
                action;

            actionSelect.appendChild(
                option
            );

        });

    }


    // ========================================================
    // RENDER
    // ========================================================
function renderAuditLogs(logs) {
    const body = document.getElementById("auditTableBody");
    const count = document.getElementById("recordCount");

    count.textContent = `${logs.length} record${logs.length === 1 ? "" : "s"}`;

    if (!logs.length) {
        body.innerHTML = `
            <tr>
                <td colspan="6" class="text-center py-8 text-slate-400">
                    No audit records found.
                </td>
            </tr>
        `;
        const pagination = document.getElementById("auditPagination");
        if (pagination) {
            pagination.style.display = "none";
            pagination.innerHTML = "";
        }
        return;
    }

    // Client-side pagination slice
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const paginatedLogs = logs.slice(start, end);

    body.innerHTML = paginatedLogs.map((log, index) => {
        const absoluteIndex = start + index;
        const targetId = log.id != null ? log.id : absoluteIndex;
        return `
        <tr class="hover:bg-slate-50 transition-colors">
            <td class="text-slate-500 whitespace-nowrap">
                ${escapeHtml(formatDateTime(log.created_at))}
            </td>
            <td class="font-medium text-slate-800">
                ${escapeHtml(log.user_name || "System")}
            </td>
            <td>
                <span class="action-pill">
                    ${escapeHtml(log.action_type || "—")}
                </span>
            </td>
            <td class="text-slate-600">
                ${escapeHtml(log.table_name || "—")}
            </td>
            <td class="text-slate-600 max-w-xs truncate" title="${escapeHtml(log.details || "—")}">
                ${escapeHtml(log.details || "—")}
            </td>
            <td>
                <button
                    class="view-btn cursor-pointer"
                    type="button"
                    onclick="openDetailsModal('${targetId}')"
                >
                    View
                </button>
            </td>
        </tr>
    `;}).join("");

    // Store the currently displayed FULL filtered records
    window.currentAuditLogs = logs;
    renderPagination(logs);
}

function changePage(nextPage) {
    const logs = window.currentAuditLogs || [];
    const totalPages = Math.max(1, Math.ceil(logs.length / PAGE_SIZE));

    if (nextPage < 1) nextPage = 1;
    if (nextPage > totalPages) nextPage = totalPages;

    currentPage = nextPage;
    renderAuditLogs(logs);
}

function renderPagination(logs) {
    const pagination = document.getElementById("auditPagination");
    if (!pagination) return;

    const totalPages = Math.max(1, Math.ceil(logs.length / PAGE_SIZE));

    if (logs.length <= PAGE_SIZE) {
        pagination.style.display = "none";
        pagination.innerHTML = "";
        return;
    }

    const prevButton = `<button type="button" class="px-3 py-1 bg-navy hover:bg-navy-dark text-white rounded text-xs font-semibold ${currentPage === 1 ? "opacity-50 cursor-not-allowed" : ""}" ${currentPage === 1 ? "disabled" : ""} onclick="changePage(${currentPage - 1})">Prev</button>`;
    const nextButton = `<button type="button" class="px-3 py-1 bg-navy hover:bg-navy-dark text-white rounded text-xs font-semibold ${currentPage >= totalPages ? "opacity-50 cursor-not-allowed" : ""}" ${currentPage >= totalPages ? "disabled" : ""} onclick="changePage(${currentPage + 1})">Next</button>`;

    pagination.innerHTML = `
        <span class="text-slate-500 text-xs">Page ${currentPage} of ${totalPages} (Total ${logs.length} entries)</span>
        <div class="flex gap-2">
            ${prevButton}
            ${nextButton}
        </div>
    `;
    pagination.style.display = "flex";
}

function openDetailsModal(target) {
    let log = null;

    if (target != null && target !== "undefined") {
        // 1. First try matching by database ID
        log = (allAuditLogs && allAuditLogs.find(l => String(l.id) === String(target))) ||
              (window.currentAuditLogs && window.currentAuditLogs.find(l => String(l.id) === String(target)));

        // 2. Fallback to array index if numeric
        if (!log && !isNaN(Number(target))) {
            const idx = Number(target);
            log = (window.currentAuditLogs && window.currentAuditLogs[idx]) ||
                  (allAuditLogs && allAuditLogs[idx]);
        }
    }

    if (!log) {
        console.error("Audit record not found for target:", target);
        alert("Unable to open record details.");
        return;
    }

    document.getElementById("detailUser").textContent = log.user_name || "System";
    document.getElementById("detailAction").textContent = log.action_type || "—";
    document.getElementById("detailTable").textContent = log.table_name || "—";
    document.getElementById("detailDate").textContent = formatDateTime(log.created_at);

    let detailsText = log.details || "No additional details";
    try {
        if (typeof detailsText === "string" && (detailsText.trim().startsWith("{") || detailsText.trim().startsWith("["))) {
            const parsed = JSON.parse(detailsText);
            detailsText = JSON.stringify(parsed, null, 2);
        }
    } catch (_) {}

    const detailEl = document.getElementById("detailDetails");
    if (detailEl) {
        detailEl.textContent = detailsText;
    }

    const modal = document.getElementById("detailsModal");
    if (modal) {
        modal.classList.add("show");
        modal.style.display = "flex";
    }
}


    // ========================================================
    // FILTERING
    // ========================================================

    function applyFilters() {

        const search =
            document
                .getElementById(
                    "searchAudit"
                )
                .value
                .trim()
                .toLowerCase();


        const user =
            document
                .getElementById(
                    "filterUser"
                )
                .value;


        const action =
            document
                .getElementById(
                    "filterAction"
                )
                .value;


        const date =
            document
                .getElementById(
                    "filterDate"
                )
                .value;


        const filtered =
            allAuditLogs.filter(
                log => {

                    const searchable = [

                        log.user_name,

                        log.action_type,

                        log.table_name,

                        log.details

                    ]
                    .join(" ")
                    .toLowerCase();


                    const matchesSearch =
                        !search ||
                        searchable.includes(
                            search
                        );


                    const matchesUser =
                        !user ||
                        log.user_name === user;


                    const matchesAction =
                        !action ||
                        log.action_type === action;


                    const matchesDate =
                        !date ||
                        getDateOnly(
                            log.created_at
                        ) === date;


                    return (
                        matchesSearch &&
                        matchesUser &&
                        matchesAction &&
                        matchesDate
                    );

                }
            );


        currentPage = 1;
        renderAuditLogs(
            filtered
        );

    }


    // ========================================================
    // RESET
    // ========================================================

    function resetFilters() {

        document.getElementById(
            "searchAudit"
        ).value = "";


        document.getElementById(
            "filterUser"
        ).value = "";


        document.getElementById(
            "filterAction"
        ).value = "";


        document.getElementById(
            "filterDate"
        ).value = "";


        currentPage = 1;
        renderAuditLogs(
            allAuditLogs
        );

    }


    // ========================================================
    // LOAD AUDIT LOGS
    // ========================================================

    async function loadAuditLogs() {

        const body =
            document.getElementById(
                "auditTableBody"
            );


        const refreshButton =
            document.getElementById(
                "refreshBtn"
            );


        try {

            refreshButton.disabled =
                true;

            refreshButton.textContent =
                "Loading...";


            body.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="text-center py-8 text-slate-400"
                    >
                        Loading audit logs...
                    </td>

                </tr>

            `;


            const data = await fetchAuditLogs();

            if (!Array.isArray(data)) {
                throw new Error("Unable to load audit logs.");
            }

            allAuditLogs = data;


            calculateSummary(
                allAuditLogs
            );


            populateFilters(
                allAuditLogs
            );


            renderAuditLogs(
                allAuditLogs
            );


        } catch (error) {

            console.error(
                "Audit loading error:",
                error
            );


            body.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="text-center py-8 text-red-500"
                    >
                        Unable to load audit logs.
                        Please try again.
                    </td>

                </tr>

            `;

        } finally {

            refreshButton.disabled =
                false;

            refreshButton.textContent =
                "Refresh";

        }

    }


    // ========================================================
    // CLOSE DETAILS MODAL
    // ========================================================


    function closeDetailsModal() {

        const modal = document.getElementById("detailsModal");
        if (modal) {
            modal.classList.remove("show");
            modal.style.display = "none";
        }

    }


    function handleModalBackdrop(event) {

        if (
            event.target.id ===
            "detailsModal"
        ) {

            closeDetailsModal();

        }

    }


    // ========================================================
    // LOGOUT
    // ========================================================

    function handleLogout(event) {

        event.preventDefault();


        if (
            confirm(
                "Are you sure you want to log out?"
            )
        ) {

            sessionStorage.clear();

            window.location.replace(
                "login.html"
            );

        }

    }


    // ========================================================
    // EVENTS
    // ========================================================

    document
        .getElementById(
            "searchAudit"
        )
        .addEventListener(
            "input",
            applyFilters
        );


    document
        .getElementById(
            "filterUser"
        )
        .addEventListener(
            "change",
            applyFilters
        );


    document
        .getElementById(
            "filterAction"
        )
        .addEventListener(
            "change",
            applyFilters
        );


    document
        .getElementById(
            "filterDate"
        )
        .addEventListener(
            "change",
            applyFilters
        );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                closeDetailsModal();

            }

        }
    );


    // ========================================================
    // INITIAL LOAD
    // ========================================================

    window.addEventListener(
        "load",
        loadAuditLogs
    );

</script>
