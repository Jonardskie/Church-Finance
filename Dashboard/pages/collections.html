<script>
/* =========================================================
   CFMMS — COLLECTIONS PAGE
   Complete Frontend Script
   ========================================================= */

/* =========================================================
   1. AUTHENTICATION
   ========================================================= */

const token = sessionStorage.getItem("token");

if (!token || token === "undefined" || token === "null") {
    sessionStorage.clear();
    document.documentElement.style.display = "none";

    alert("Access Denied: Please log in first.");

    window.location.replace("login.html");

    throw new Error("Unauthenticated session.");
}


/* =========================================================
   2. LOGOUT
   ========================================================= */

function handleLogout(event) {

    event.preventDefault();

    if (confirm("Are you sure you want to log out?")) {

        sessionStorage.clear();

        window.location.replace("login.html");
    }
}


/* =========================================================
   3. GLOBAL COLLECTION DATA
   ========================================================= */

let collectionsData = [];
let memberOptions = [];
let collectionTypeOptions = [];


/* =========================================================
   4. API HELPER
   ========================================================= */

const COLLECTIONS_CACHE_TTL = 5 * 60 * 1000;

function getCachedJson(key, ttl = COLLECTIONS_CACHE_TTL) {
    try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;

        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return null;

        if (Date.now() > (parsed.expiresAt || 0)) {
            localStorage.removeItem(key);
            return null;
        }

        return parsed.value;
    } catch {
        return null;
    }
}

function setCachedJson(key, value, ttl = COLLECTIONS_CACHE_TTL) {
    try {
        localStorage.setItem(key, JSON.stringify({
            value,
            expiresAt: Date.now() + ttl
        }));
    } catch {
        // ignore cache write errors
    }
}

async function cachedFetchJson(url, options = {}, key, ttl = COLLECTIONS_CACHE_TTL) {
    const method = (options.method || "GET").toUpperCase();
    const cacheKey = key || `cfmms:${method}:${url}`;

    if (method === "GET") {
        const cached = getCachedJson(cacheKey, ttl);
        if (cached !== null) {
            return cached;
        }
    }

    try {
        const response = await fetch(url, options);

        const responseText = await response.text();
        let data;

        try {
            data = responseText ? JSON.parse(responseText) : null;
        } catch {
            data = responseText;
        }

        if (response.ok && method === "GET") {
            setCachedJson(cacheKey, data, ttl);
        }

        return data;
    } catch (error) {
        if (method === "GET") {
            const cached = getCachedJson(cacheKey, ttl);
            if (cached !== null) {
                return cached;
            }
        }

        throw error;
    }
}

async function apiRequest(url, options = {}) {

    const method = (options.method || "GET").toUpperCase();
    const requestOptions = {
        ...options,

        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
            ...(options.headers || {})
        }
    };

    const data = await cachedFetchJson(
        url,
        requestOptions,
        `cfmms:${method}:${url}`,
        COLLECTIONS_CACHE_TTL
    );

    if (data && data.error) {
        throw new Error(data.error || data.message || "Server error");
    }

    return data;
}


/* =========================================================
   5. LOAD MEMBERS
   ========================================================= */

async function loadMemberDropdown() {
    try {

        const members =
            await apiRequest("/api/members");


        memberOptions = [
            { id: "ANONYMOUS", name: "Anonymous / Guest" },
            ...members
                .filter(member => member.status === "Active")
                .map(member => ({
                    id: member.member_id,
                    name: `${member.official_name} (${member.member_id})`
                }))
        ];

    } catch (error) {

        console.error(
            "Error loading members:",
            error
        );


        memberOptions = [];
    }
}


function renderSuggestions(searchId, suggestionsId, options) {

    const searchInput =
        document.getElementById(searchId);

    const suggestions =
        document.getElementById(suggestionsId);

    if (!searchInput || !suggestions) return;

    const query = searchInput.value.toLowerCase().trim();
    const matches = options
        .filter(option => option.name.toLowerCase().includes(query))
        .sort((first, second) => {
            const firstStarts = first.name.toLowerCase().startsWith(query);
            const secondStarts = second.name.toLowerCase().startsWith(query);
            return Number(secondStarts) - Number(firstStarts);
        });

    suggestions.innerHTML = matches.length
        ? matches.map(option =>
            `<li data-value="${escapeHTML(option.id)}" data-name="${escapeHTML(option.name)}">${escapeHTML(option.name)}</li>`
        ).join("")
        : "<li>No matching names found</li>";

    suggestions.style.display = "block";
}


function selectSuggestion(suggestion, searchId, hiddenId, suggestionsId) {

    document.getElementById(searchId).value = suggestion.dataset.name;
    document.getElementById(hiddenId).value = suggestion.dataset.value;
    document.getElementById(suggestionsId).style.display = "none";
}


function handleSuggestionKeyboard(event, searchId, suggestionsId, hiddenId) {

    const suggestions = document.getElementById(suggestionsId);
    const visibleSuggestions = Array.from(
        suggestions.querySelectorAll("li[data-value]")
    );

    if (!visibleSuggestions.length) return;

    const activeIndex = visibleSuggestions.findIndex(
        suggestion => suggestion.classList.contains("active")
    );

    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();

        const direction = event.key === "ArrowDown" ? 1 : -1;
        const nextIndex = activeIndex < 0
            ? direction === 1 ? 0 : visibleSuggestions.length - 1
            : (activeIndex + direction + visibleSuggestions.length) % visibleSuggestions.length;

        visibleSuggestions.forEach(suggestion => suggestion.classList.remove("active"));
        const activeSuggestion = visibleSuggestions[nextIndex];
        activeSuggestion.classList.add("active");
        activeSuggestion.scrollIntoView({ block: "nearest" });
        return;
    }

    if (event.key === "Enter") {
        event.preventDefault();
        const activeSuggestion = visibleSuggestions[activeIndex < 0 ? 0 : activeIndex];
        selectSuggestion(activeSuggestion, searchId, hiddenId, suggestionsId);
        return;
    }

    if (event.key === "Escape") {
        event.preventDefault();
        suggestions.style.display = "none";
    }
}


document.getElementById("memberSearch")?.addEventListener(
    "input",
    () => {
        document.getElementById("collectionMemberId").value = "";
        renderSuggestions("memberSearch", "memberSuggestions", memberOptions);
    }
);

document.getElementById("collectionTypeSearch")?.addEventListener(
    "input",
    () => {
        document.getElementById("collectionType").value = "";
        renderSuggestions("collectionTypeSearch", "collectionTypeSuggestions", collectionTypeOptions);
    }
);

document.getElementById("memberSearch")?.addEventListener(
    "keydown",
    event => handleSuggestionKeyboard(
        event,
        "memberSearch",
        "memberSuggestions",
        "collectionMemberId"
    )
);

document.getElementById("collectionTypeSearch")?.addEventListener(
    "keydown",
    event => handleSuggestionKeyboard(
        event,
        "collectionTypeSearch",
        "collectionTypeSuggestions",
        "collectionType"
    )
);

document.getElementById("memberSuggestions")?.addEventListener("click", event => {
    const suggestion = event.target.closest("li[data-value]");
    if (!suggestion) return;

    selectSuggestion(
        suggestion,
        "memberSearch",
        "collectionMemberId",
        "memberSuggestions"
    );
});

document.getElementById("collectionTypeSuggestions")?.addEventListener("click", event => {
    const suggestion = event.target.closest("li[data-value]");
    if (!suggestion) return;

    selectSuggestion(
        suggestion,
        "collectionTypeSearch",
        "collectionType",
        "collectionTypeSuggestions"
    );
});


/* =========================================================
   6. LOAD COLLECTION TYPES
   ========================================================= */

async function loadCollectionTypes() {
    try {

        const types =
            await apiRequest("/api/collection-types");


        collectionTypeOptions = types
            .filter(
                type =>
                    type.status === "Active"
            )
            .map(type => ({ id: type.name, name: type.name }));

    } catch (error) {

        console.error(
            "Collection type loading error:",
            error
        );


        collectionTypeOptions = [];
    }
}


/* =========================================================
   7. LOAD COLLECTIONS
   ========================================================= */

async function loadCollectionsFromDB() {

    try {

        collectionsData =
            await apiRequest("/api/collections");


        if (!Array.isArray(collectionsData)) {
            collectionsData = [];
        }


        renderCollectionsTable();


    } catch (error) {

        console.error(
            "Collections loading error:",
            error
        );


        const tableBody =
            document.getElementById(
                "collectionTableBody"
            );


        if (tableBody) {

            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="7"
                        style="
                            text-align:center;
                            color:#ef4444;
                            padding:30px;
                        "
                    >
                        Failed to load collections.
                    </td>
                </tr>
            `;
        }
    }
}


/* =========================================================
   8. RENDER COLLECTION TABLE
   ========================================================= */

function renderCollectionsTable() {

    const tableBody =
        document.getElementById(
            "collectionTableBody"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const statusFilter =
        document.getElementById(
            "statusFilter"
        );


    if (!tableBody) return;


    const search =
        searchInput
            ? searchInput.value.toLowerCase().trim()
            : "";


    const selectedStatus =
        statusFilter
            ? statusFilter.value.toLowerCase()
            : "all status";


    const filteredData =
        collectionsData.filter(item => {

            const memberName =
                String(
                    item.member_name || ""
                ).toLowerCase();


            const date =
                String(
                    item.date || ""
                ).toLowerCase();


            const type =
                String(
                    item.type || ""
                ).toLowerCase();


            const fund =
                String(
                    item.fund_category || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                memberName.includes(search) ||
                date.includes(search) ||
                type.includes(search) ||
                fund.includes(search);


            const itemStatus =
                String(
                    item.status || ""
                ).toLowerCase();


            const matchesStatus =
                selectedStatus === "all status" ||
                itemStatus === selectedStatus;


            return (
                matchesSearch &&
                matchesStatus
            );
        });


    tableBody.innerHTML = "";


    if (filteredData.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    style="
                        text-align:center;
                        color:#94a3b8;
                        padding:30px;
                    "
                >
                    No matching collections found.
                </td>
            </tr>
        `;


        updateCollectionMetrics();

        return;
    }


    filteredData.forEach(item => {

        const cleanDate =
            item.date
                ? String(item.date).split("T")[0]
                : "N/A";


        const amount =
            Number(item.amount || 0)
                .toLocaleString();


        const status =
            String(
                item.status || ""
            ).toLowerCase();


        let actions = "";


        if (status === "pending") {

            actions = `
                <button
                    class="action-btn action-btn-verify"
                    onclick="verifyCollection(${item.id})"
                    title="Verify"
                >
                    Verify
                </button>

                <button
                    class="action-btn action-btn-delete"
                    onclick="deleteCollection(${item.id})"
                    title="Delete"
                >
                    Delete
                </button>
            `;

        } else {

            actions = `
                <button
                    class="action-btn action-btn-delete"
                    onclick="deleteCollection(${item.id})"
                    title="Delete"
                >
                    Delete
                </button>
            `;
        }


        tableBody.innerHTML += `
            <tr class="hover:bg-slate-50 transition-colors">

                <td class="text-slate-500">
                    ${escapeHTML(cleanDate)}
                </td>

                <td class="text-bold">
                    ${escapeHTML(
                        item.member_name || "Guest"
                    )}
                </td>

                <td class="text-slate-700">
                    ${escapeHTML(
                        item.type || "N/A"
                    )}
                </td>

                <td class="text-slate-600">
                    ${escapeHTML(
                        item.fund_category || "N/A"
                    )}
                </td>

                <td class="text-amount">
                    ₱${amount}
                </td>

                <td>
                    <span
                        class="status-badge status-${status}"
                    >
                        ${escapeHTML(status)}
                    </span>
                </td>

                <td class="space-x-1 whitespace-nowrap">
                    ${actions}
                </td>

            </tr>
        `;
    });


    updateCollectionMetrics();
}

/* =========================================================
   11. RECORD NEW COLLECTION
   ========================================================= */

const collectionForm =
    document.getElementById("collectionForm");


if (collectionForm) {

    collectionForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const memberDropdown =
                document.getElementById(
                    "collectionMemberId"
                );


            const typeDropdown =
                document.getElementById(
                    "collectionType"
                );


            if (!memberDropdown.value) {

                alert(
                    "Please select a member."
                );

                return;
            }


            if (!typeDropdown.value) {

                alert(
                    "Please select a collection type."
                );

                return;
            }


            const amount =
                Number(
                    document.getElementById(
                        "collectionAmount"
                    ).value
                );


            if (!amount || amount <= 0) {

                alert(
                    "Please enter a valid amount."
                );

                return;
            }


            const payload = {

                date:
                    document.getElementById(
                        "collectionDate"
                    ).value,


                member_id:
                    memberDropdown.value,


                member_name:
                    document.getElementById(
                        "memberSearch"
                    ).value
                        .split("(")[0]
                        .trim(),


                type:
                    typeDropdown.value,


                amount:
                    amount,


                status:
                    document.getElementById(
                        "verificationStatus"
                    ).value
            };


            try {

                const result =
                    await apiRequest(
                        "/api/collections",
                        {
                            method: "POST",

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );


                console.log(
                    "Collection saved:",
                    result
                );


                alert(
                    "Collection recorded successfully."
                );


                localStorage.removeItem(
                    "cfmms:GET:/api/collections"
                );


                localStorage.removeItem(
                    "cfmms:dashboard:collections"
                );


                collectionForm.reset();

                document.getElementById("memberSuggestions").style.display = "none";
                document.getElementById("collectionTypeSuggestions").style.display = "none";

                closeModal();


                await loadCollectionsFromDB();


            } catch (error) {

                console.error(
                    "Save collection error:",
                    error
                );


                alert(
                    error.message
                );
            }
        }
    );
}


/* =========================================================
   12. VERIFY COLLECTION
   ========================================================= */

async function verifyCollection(id) {

    if (
        !confirm(
            "Verify this collection?"
        )
    ) {
        return;
    }


    try {

        await apiRequest(
            `/api/collections/verify/${id}`,
            {
                method: "PUT",

                body: JSON.stringify({
                    status: "verified"
                })
            }
        );


        alert(
            "Collection verified successfully."
        );


        localStorage.removeItem(
            "cfmms:GET:/api/collections"
        );


        localStorage.removeItem(
            "cfmms:dashboard:collections"
        );


        await loadCollectionsFromDB();


    } catch (error) {

        console.error(
            "Verification error:",
            error
        );


        alert(
            error.message
        );
    }
}


/* =========================================================
   13. DELETE COLLECTION
   ========================================================= */

async function deleteCollection(id) {

    if (
        !confirm(
            "Permanently delete this collection record?"
        )
    ) {
        return;
    }


    try {

        await apiRequest(
            `/api/collections/${id}`,
            {
                method: "DELETE"
            }
        );


        alert(
            "Collection deleted successfully."
        );


        localStorage.removeItem(
            "cfmms:GET:/api/collections"
        );


        localStorage.removeItem(
            "cfmms:dashboard:collections"
        );


        await loadCollectionsFromDB();


    } catch (error) {

        console.error(
            "Delete collection error:",
            error
        );


        alert(
            error.message
        );
    }
}


/* =========================================================
   14. COLLECTION METRICS
   ========================================================= */

function updateCollectionMetrics() {

    const totalRecords =
        collectionsData.length;


    let totalAmount = 0;

    let pendingCount = 0;


    collectionsData.forEach(item => {

        totalAmount +=
            Number(item.amount || 0);


        if (
            String(item.status).toLowerCase() ===
            "pending"
        ) {
            pendingCount++;
        }
    });


    const formattedTotal =
        `₱${totalAmount.toLocaleString()}`;


    const todayTotal =
        document.getElementById(
            "todayTotal"
        );


    const todayCount =
        document.getElementById(
            "todayCount"
        );


    const weeklyTotal =
        document.getElementById(
            "weeklyTotal"
        );


    const weeklyCount =
        document.getElementById(
            "weeklyCount"
        );


    const monthlyTotal =
        document.getElementById(
            "monthlyTotal"
        );


    const monthlyCount =
        document.getElementById(
            "monthlyCount"
        );


    const pendingVerificationCount =
        document.getElementById(
            "pendingVerificationCount"
        );


    const pendingPercentText =
        document.getElementById(
            "pendingPercentText"
        );


    if (todayTotal)
        todayTotal.textContent =
            formattedTotal;


    if (todayCount)
        todayCount.textContent =
            `${totalRecords} records`;


    if (weeklyTotal)
        weeklyTotal.textContent =
            formattedTotal;


    if (weeklyCount)
        weeklyCount.textContent =
            `${totalRecords} records`;


    if (monthlyTotal)
        monthlyTotal.textContent =
            formattedTotal;


    if (monthlyCount)
        monthlyCount.textContent =
            `${totalRecords} records`;


    if (pendingVerificationCount)
        pendingVerificationCount.textContent =
            pendingCount;


    const percentage =
        totalRecords > 0
            ? (
                (pendingCount / totalRecords) *
                100
              ).toFixed(1)
            : "0.0";


    if (pendingPercentText)
        pendingPercentText.textContent =
            `${percentage}% of total`;
}

async function openModal() {

    const modal =

            "collectionModal"
        );

        document.getElementById(

        );


    if (!modal) return;


    if (dateInput) {

    modal.style.display = "flex";

}

function closeModal() {

    const modal =
        document.getElementById(
            "collectionModal"
        );


    if (modal) {
        modal.classList.remove("show");
        modal.style.display =
            "none";
    }
}

   ========================================================= */

const collectionModal =

if (collectionModal) {

}


/* =========================================================
   18. HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}
