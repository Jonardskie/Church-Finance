<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFMMS - Login</title>
    <link rel="icon" href="/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#1B365D', dark: '#0F2038', light: '#2A4D7E' },
                        gold: { DEFAULT: '#D97706', light: '#F59E0B', dark: '#B45309' }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out both'
                    },
                    keyframes: {
                        fadeIn: {
                            from: { opacity: '0', transform: 'translateY(8px)' },
                            to:   { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-[100dvh] bg-slate-900 flex items-center justify-center p-3 sm:p-6 font-sans">

<div class="bg-white w-full max-w-sm md:max-w-4xl rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col md:flex-row overflow-hidden animate-fade-in my-auto md:min-h-[580px]">

    <!-- LEFT — Brand Panel (Navy) — Desktop / Tablet -->
    <div class="hidden md:flex flex-[1.15] bg-navy flex-col items-center justify-center relative p-12 overflow-hidden">

        <!-- Ambient glow blob behind logo -->
        <div class="absolute w-72 h-72 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"
             style="background: radial-gradient(circle, rgba(217,119,6,0.15) 0%, rgba(27,54,93,0) 70%);"></div>

        <!-- Decorative ring top-right -->
        <div class="absolute top-8 right-8 w-20 h-20 border border-white/10 rounded-full pointer-events-none"></div>
        <div class="absolute top-12 right-12 w-10 h-10 border border-white/10 rounded-full pointer-events-none"></div>

        <!-- Bottom left accent -->
        <div class="absolute bottom-6 left-6 w-24 h-24 border border-white/8 rounded-full pointer-events-none"></div>

        <div class="relative z-10 flex flex-col items-center gap-7 max-w-xs w-full">
            <img src="/images/UMCVision.webp"
                 alt="Maui UMC Logo"
                 class="w-full max-h-52 object-contain drop-shadow-2xl transition-transform duration-300 hover:scale-105">
            <p class="text-xs text-slate-400 text-center font-medium leading-relaxed tracking-wide border-t border-white/10 pt-4 max-w-xs">
                Church Funds & Management<br>Monitoring System Workspace
            </p>
        </div>
    </div>

    <!-- RIGHT — Login Form Panel (Gold Gradient) -->
    <div class="flex flex-1 items-center justify-center relative p-4 sm:p-8 overflow-hidden w-full"
         style="background: linear-gradient(135deg, #D97706 0%, #B45309 100%);">

        <!-- Decorative circles -->
        <div class="absolute bottom-[-60px] right-[-60px] w-52 h-52 border-2 border-dashed border-white/20 rounded-full pointer-events-none"></div>
        <div class="absolute bottom-[-30px] right-[-30px] w-36 h-36 border border-white/12 rounded-full pointer-events-none"></div>
        <div class="absolute top-6 left-6 w-16 h-16 border border-white/10 rounded-full pointer-events-none"></div>

        <!-- White Login Card -->
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 sm:p-9 shadow-2xl relative z-10">

            <!-- Mobile Brand Header (Visible only on phone screens) -->
            <div class="flex md:hidden items-center justify-center gap-3 mb-5 pb-4 border-b border-slate-100">
                <img src="/images/UMCVision.webp" alt="Maui UMC Logo" class="h-10 w-auto object-contain">
                <div class="text-left">
                    <h2 class="text-sm font-bold text-navy leading-tight">Maui United Methodist</h2>
                    <p class="text-[10px] text-slate-400 font-medium">CFMMS Portal</p>
                </div>
            </div>

            <div class="mb-5 sm:mb-7">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Hello!</h1>
                <p class="text-xs sm:text-sm text-slate-500 font-normal mt-1">Sign in to your account</p>
            </div>

            <!-- Error Toast -->
            <div id="errorBlock"
                 class="hidden bg-red-50 text-red-600 border border-red-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-medium mb-5 shadow-sm">
            </div>

            <form id="authLoginForm" autocomplete="off">

                <!-- Hidden Church Code (defaults to maui or read from URL) -->
                <input type="hidden" id="churchSlug" value="maui">

                <!-- Username field -->
                <div class="relative mb-4 sm:mb-5">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </span>
                    <input type="text"
                           id="userEmail"
                           placeholder="Member ID or Username"
                           required
                           class="w-full pl-11 pr-4 py-3 sm:py-3.5 border border-slate-200 rounded-xl font-sans text-sm text-slate-800 bg-slate-50 outline-none transition-all duration-200
                                  focus:bg-white focus:border-navy focus:ring-4 focus:ring-navy/10 placeholder:text-slate-400">
                </div>

                <!-- Password field -->
                <div class="relative mb-5 sm:mb-6">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </span>
                    <input type="password"
                           id="userPassword"
                           placeholder="Password"
                           required
                           class="w-full pl-11 pr-12 py-3 sm:py-3.5 border border-slate-200 rounded-xl font-sans text-sm text-slate-800 bg-slate-50 outline-none transition-all duration-200
                                  focus:bg-white focus:border-navy focus:ring-4 focus:ring-navy/10 placeholder:text-slate-400">
                    <button type="button"
                            onclick="togglePasswordVisibility()"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                        <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>

                <!-- Submit button -->
                <button type="submit"
                        class="w-full bg-navy hover:bg-navy-dark text-white py-3.5 rounded-xl font-semibold text-sm
                               shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0
                               border border-navy/20 mt-1 mb-4 sm:mb-6 font-sans">
                    Sign In
                </button>

            </form>

            <p class="text-center text-xs text-slate-400 font-medium">
                Maui United Methodist Church &copy; 2025
            </p>

        </div>
    </div>

</div>

    <!-- JAVASCRIPT AUTHENTICATION & REDIRECT LOGIC -->
    <script>
    // Password visibility toggle helper
    function togglePasswordVisibility() {
        const input = document.getElementById("userPassword");
        const eyeIcon = document.getElementById("eyeIcon");
        if (!input) return;

        if (input.type === "password") {
            input.type = "text";
            eyeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
            `;
        } else {
            input.type = "password";
            eyeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            `;
        }
    }

    // AUTO-FORWARD GUARD: If a token already exists, route them to their proper landing page
    (function() {
        const token = sessionStorage.getItem("token");
        const role = (sessionStorage.getItem("role") || "").toLowerCase();
        
        if (token && token !== "undefined" && token !== "null") {
            const mgmtRoles = ["admin", "pastor", "secretary", "treasurer", "finance"];
            if (mgmtRoles.includes(role)) {
                window.location.href = "index.html";
            } else {
                window.location.href = "member_portal.html";
            }
        }
    })();

    // Auto-detect church from URL (?church=grace or subdomain)
    const urlParams = new URLSearchParams(window.location.search);
    const churchFromUrl = urlParams.get("church") || urlParams.get("church_slug");
    if (churchFromUrl) {
        const slugInput = document.getElementById("churchSlug");
        if (slugInput) slugInput.value = churchFromUrl.toLowerCase();
    }

    document.getElementById("authLoginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const churchSlug = (document.getElementById("churchSlug")?.value || "maui").trim().toLowerCase();
        const username = document.getElementById("userEmail").value.trim();
        const password = document.getElementById("userPassword").value;
        const errorBlock = document.getElementById("errorBlock");
        const submitBtn = document.getElementById("loginSubmitBtn");

        if (errorBlock) {
            errorBlock.classList.add("hidden");
            errorBlock.style.display = "none";
            errorBlock.innerText = "";
        }

        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Signing in...</span>`;
        }

        try {
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Church-Slug": churchSlug
                },
                body: JSON.stringify({ username, password, church_slug: churchSlug })
            });

            const data = await res.json();

            if (!res.ok || !data.token) {
                if (errorBlock) {
                    errorBlock.innerText = data.message || data.error || "Invalid credentials.";
                    errorBlock.classList.remove("hidden");
                    errorBlock.style.display = "block";
                } else {
                    alert(data.message || data.error || "Login failed");
                }
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Sign In</span><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
                }
                return;
            }

            // Clear any old multi-tenant cache from previous sessions
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && (k.startsWith("cfmms:") || k.startsWith("church_"))) {
                    keysToRemove.push(k);
                }
            }
            keysToRemove.forEach(k => localStorage.removeItem(k));

            // Store session tokens safely
            sessionStorage.setItem("token", data.token);
            sessionStorage.setItem("role", data.role || "Member");
            sessionStorage.setItem("username", data.username);
            sessionStorage.setItem("name", data.name || data.username);
            sessionStorage.setItem("church_slug", data.church_slug || churchSlug);

            // ROLE-BASED REDIRECT
            const userRole = (data.role || "member").toLowerCase();
            const mgmtRoles = ["admin", "pastor", "secretary", "treasurer", "finance"];
            
            if (mgmtRoles.includes(userRole)) {
                window.location.href = "index.html";
            } else {
                window.location.href = "member_portal.html";
            }

        } catch (err) {
            console.error("Login client error:", err);
            if (errorBlock) {
                errorBlock.innerText = "Server connection failure.";
                errorBlock.classList.remove("hidden");
                errorBlock.style.display = "block";
            } else {
                alert("Server connection failure.");
            }
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In</span><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
            }
        }
    });
    </script>

    <script src="../js/form-validation.js"></script>
</body>
</html>
